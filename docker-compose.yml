# One command to run everything:  docker compose up --build
#   Web app : http://localhost:5173
#   API     : http://localhost:4000/api/health
name: doomsday-ready

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
      POSTGRES_DB: doomsday_ready
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsday -d doomsday_ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://doomsday:doomsday@db:5432/doomsday_ready?schema=public
      # Origin of the web app (CORS). The browser talks to the API through the web container, so this is the web address.
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    # The container first applies the migration and seeds the sample data, so give it time before the first check.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "4000:4000"
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
